name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 11 * * 1"  # Mondays: the live test catches changes in cyber.gc.ca's format early

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every Python version, not just the first failure
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - run: pytest -q

  live:
    # Real requests to cyber.gc.ca: weekly and on demand only, never on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - run: MAPLEWATCH_LIVE=1 pytest -q -m live

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks dir . --redact --verbose
